repositories {
    mavenCentral()
    maven { url 'https://repo.dairy.foundation/releases/'}
    google() // Needed for androidx
    maven { url = 'https://maven.brott.dev/' }   // FTC Dashboard
}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:11.2.1'
    implementation 'org.firstinspires.ftc:Blocks:11.2.1'
    //noinspection Aligned16KB
    implementation 'org.firstinspires.ftc:RobotCore:11.2.1'
    implementation 'org.firstinspires.ftc:RobotServer:11.2.1'
    implementation 'org.firstinspires.ftc:OnBotJava:11.2.1'
    implementation 'org.firstinspires.ftc:Hardware:11.2.1'
    implementation 'org.firstinspires.ftc:FtcCommon:11.2.1'
    implementation 'org.firstinspires.ftc:Vision:11.2.1'
    implementation 'androidx.appcompat:appcompat:1.2.0'

    implementation 'com.pedropathing:revhub:3.0.1'
    implementation 'com.pedropathing.ivy:pedro:1.1.1'

    // !! NOT MATCH LEGAL WHILE THESE TWO ARE HERE (BIOBUZZ R704) !!
    // AutoTune (web UI :10158) and FTC Dashboard (:8080/dash) each bind a web server whenever they are
    // in the APK, and R704 prohibits streaming/dashboard tools during matches. Before an event, delete
    // these two lines AND pedro/Tuning.java, pedro/procedures/ and opmodes/test/ShooterBench.java (the
    // only sources that import them), or the build will not compile.
    implementation 'com.pedropathing:tuning:1.0.1'
    implementation('com.acmerobotics.dashboard:dashboard:0.6.0') {
        exclude group: 'org.firstinspires.ftc'
    }
}